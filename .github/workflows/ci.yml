name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Umożliwia ręczne uruchomienie z poziomu zakładki Actions na GitHubie

jobs:
  test:
    name: Testy i Jakość Kodu
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v7

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchomienie testów (pytest)
        run: |
          pytest --maxfail=1 --disable-warnings -q
